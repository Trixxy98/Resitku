name: resitku

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: resitku
      POSTGRES_PASSWORD: resitku_local
      POSTGRES_DB: resitku
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resitku -d resitku"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # Tag berbilang seni bina terkini yang masih menyokong arm64. Tag 2025
    # yang lebih baharu bagi edisi komuniti cuma diterbitkan untuk amd64
    # selepas MinIO menyusun semula lesen mereka.
    image: quay.io/minio/minio:RELEASE.2024-01-16T16-07-38Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: resitku
      MINIO_ROOT_PASSWORD: resitku_local
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Satu container sekali-jalan yang mencipta baldi resit lalu keluar. MinIO
  # sendiri tidak pernah mencipta baldi secara automatik semasa bermula.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 resitku resitku_local &&
      mc mb --ignore-existing local/resitku-receipts
      "
    restart: "no"

  elasticmq:
    image: softwaremill/elasticmq-native:1.6.11
    restart: unless-stopped
    ports:
      - "9324:9324"
      - "9325:9325"
    volumes:
      - ./elasticmq.conf:/opt/elasticmq.conf:ro

volumes:
  postgres_data:
  minio_data:
