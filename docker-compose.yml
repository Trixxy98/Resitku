name: resitku

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: resitku
      POSTGRES_PASSWORD: resitku_local
      POSTGRES_DB: resitku
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resitku -d resitku"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
